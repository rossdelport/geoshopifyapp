<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__</title>
<meta name="description" content="__DESCRIPTION__">
<!-- firstpicked.com.au/for/<niche> (served by app/routes/for.$niche.tsx, Ross 17 Nov 2026): the pages Ross's video ads
     send each niche to. Ross's video first, the "Book a call" button right under it, then the numbers. The words for
     each niche are in app/lib/vsl/pages.ts and drawn by app/lib/vsl/render.ts in place of the VSL_BODY marker. The home page's
     look (app/home/new-home.html: the same font, colours and buttons), copied here so the pages can change apart.
     Kept out of search (noindex): they're for ads, and they're near-copies of each other. -->
<meta name="robots" content="noindex">
<link rel="canonical" href="__URL__">
<meta name="theme-color" content="#ffffff">
<meta property="og:type" content="website">
<meta property="og:site_name" content="FirstPicked">
<meta property="og:title" content="__TITLE__">
<meta property="og:description" content="__DESCRIPTION__">
<meta property="og:url" content="__URL__">
<meta property="og:image" content="https://firstpicked.com.au/og/home.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preload" href="__FONT_URL__" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:Inter;src:url(__FONT_URL__) format("woff2");font-weight:400 700;font-style:normal;font-display:swap}
@font-face{font-family:"Inter Fallback";src:local("Arial");ascent-override:93.51%;descent-override:23.28%;line-gap-override:0%;size-adjust:103.6%}
@font-face{font-family:"Inter Display Fallback";src:local("Arial");font-weight:400 500;ascent-override:98.85%;descent-override:24.61%;line-gap-override:0%;size-adjust:98%}
@font-face{font-family:"Inter Display Fallback";src:local("Arial Bold"),local("Arial-BoldMT");font-weight:600 700;ascent-override:104.17%;descent-override:25.94%;line-gap-override:0%;size-adjust:93%}

:root{
  --ink:#0e0e13;--ink-2:#53565f;--head:#25272e;--text:#666972;--soft:#6e717a;
  --line:#ececf0;--bg-2:#f6f6f9;
  --accent:#6c5cf2;--accent-hi:#8476f7;--accent-lo:#5a49e6;--accent-ink:#5442df;
  --accent-50:#f2f0fe;--accent-100:#e4e0fd;--accent-ring:rgba(108,92,242,.35);
  --t1:#aba3f4;--t2:#bbb4f6;--t3:#dcd9fc;
  --font:Inter,"Inter Fallback",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:Inter,"Inter Display Fallback",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --gut:16px;
}
@media (min-width:640px){:root{--gut:24px}}
@media (min-width:1024px){:root{--gut:40px}}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:#fff;color:var(--text);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-x:clip}
img,svg{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
h1,h2,h3,p,ul,blockquote{margin:0}
ul{padding:0;list-style:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
::selection{background:var(--accent-100);color:var(--ink)}
[hidden]{display:none!important}
.wrap{max-width:1200px;margin:0 auto;padding:0 var(--gut)}
.narrow{max-width:calc(820px + 2 * var(--gut))}

.h1{font-family:var(--display);color:var(--ink-2);font-weight:450;font-size:clamp(2rem,1.3rem + 2.6vw,3.2rem);line-height:1.08;letter-spacing:-.04em;text-wrap:balance}
.h1 b,.h2 b{display:block;color:var(--ink);font-weight:600}
.h2{font-family:var(--display);color:var(--ink-2);font-weight:450;font-size:clamp(1.65rem,1.2rem + 1.6vw,2.4rem);line-height:1.1;letter-spacing:-.035em;text-wrap:balance}
.center{text-align:center}
.lead{font-size:clamp(1.05rem,1rem + .25vw,1.2rem);line-height:1.55;letter-spacing:-.01em;text-wrap:pretty}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 20px;border-radius:11px;font-size:15px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;-webkit-tap-highlight-color:transparent;transition:transform .15s ease,box-shadow .2s ease,background .2s ease}
.btn:active{transform:scale(.97)}
.btn-pri{color:#fff;background:linear-gradient(180deg,#7262f4,#5f4feb);border:1px solid var(--accent-lo);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 1px 2px rgba(60,40,190,.25),0 8px 20px -8px rgba(108,92,242,.7)}
.btn-pri:hover{background:linear-gradient(180deg,#6a5af1,#5544e3)}
.btn-white{color:var(--accent-ink);background:#fff;box-shadow:0 1px 2px rgba(18,18,40,.12),0 10px 24px -10px rgba(10,5,60,.6)}
.btn-white:hover{background:#f7f6ff}
.btn-sm{height:38px;padding:0 15px;font-size:14px;border-radius:9px}
.btn-lg{height:56px;padding:0 28px;font-size:17px;border-radius:13px}

.top{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{display:inline-flex;align-items:center;gap:9px;font-size:21px;font-weight:650;letter-spacing:-.03em;color:var(--ink)}
.mark{position:relative;flex:none;width:25px;height:23px}
.mark i{position:absolute;width:16px;height:16px;border-radius:50%}
.mark i:first-child{left:0;top:0;background:#cdc6fc}
.mark i:last-child{right:0;bottom:0;background:var(--accent)}

/* The hero: who it's for, the heading, then the video and the button, all in the middle */
.hero{padding:clamp(16px,4vw,40px) 0 clamp(48px,7vw,80px);text-align:center}
.eyebrow{display:inline-block;margin-bottom:16px;padding:6px 13px;border-radius:999px;background:var(--accent-50);font-size:13.5px;font-weight:600;color:var(--accent-ink);text-wrap:balance}
.hero .lead{max-width:36em;margin:16px auto 0}

/* Ross's video, on the purple panel the home page's pictures use */
.vsl{position:relative;margin:28px auto 0;max-width:820px;aspect-ratio:16 / 9;border-radius:20px;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,0) 16%),radial-gradient(62% 48% at 50% 112%,rgba(255,255,255,.95),rgba(255,255,255,0) 72%),linear-gradient(180deg,var(--t1),var(--t2) 64%,var(--t3));box-shadow:0 0 0 1px rgba(18,18,40,.06),0 30px 60px -28px rgba(45,30,140,.55)}
.vsl-tall{max-width:380px}
.vsl-video{display:block;width:100%;height:100%;object-fit:cover;background:#1b1830}
.vsl-soon{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px}
.vsl-ross{width:72px;height:72px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 4px rgba(255,255,255,.7)}
.vsl-play{display:grid;place-items:center;width:58px;height:58px;border-radius:50%;background:#fff;color:var(--accent-ink);box-shadow:0 10px 24px -10px rgba(40,25,130,.6)}
.vsl-play svg{width:24px;height:24px;margin-left:3px}
.vsl-note{font-size:14.5px;color:var(--head)}
.vsl-note b{display:block;font-size:16px;color:var(--ink)}
@media (max-width:520px){.vsl-soon{gap:8px;padding:14px}.vsl-ross{width:56px;height:56px}.vsl-note{font-size:13.5px}.vsl-note b{font-size:15px}}
.vsl-btn{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;padding-bottom:18px;background:linear-gradient(180deg,rgba(0,0,0,0) 55%,rgba(10,6,40,.45))}
.vsl-pill{display:inline-flex;align-items:center;gap:10px;padding:6px 16px 6px 6px;border-radius:999px;background:#fff;font-size:15px;font-weight:600;color:var(--ink);box-shadow:0 10px 24px -10px rgba(0,0,0,.5)}
.vsl-pill .vsl-play{width:38px;height:38px;color:#fff;background:var(--accent)}
.vsl-pill .vsl-play svg{width:17px;height:17px}
.vsl-len{font-weight:500;color:var(--soft)}

.cta{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:24px}
.cta-sub{font-size:14px;color:var(--soft);text-wrap:balance}
.cta-sub a{color:var(--accent-ink);font-weight:600;white-space:nowrap}
.cta-sub a:hover{text-decoration:underline}

.sec{padding:clamp(56px,8vw,96px) 0}
.sec-soft{background:var(--bg-2)}

/* What they pay now, then ours */
.costs{display:grid;gap:12px;margin-top:28px}
@media (min-width:640px){.costs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cost{display:flex;flex-direction:column;gap:4px;padding:20px 22px;border-radius:16px;background:#fff;box-shadow:0 0 0 1px var(--line),0 10px 24px -18px rgba(18,18,40,.25)}
.cost-v{font-family:var(--display);font-size:clamp(1.7rem,1.4rem + 1vw,2.2rem);font-weight:600;line-height:1.1;letter-spacing:-.035em;color:var(--ink)}
.cost-t{font-size:15px;line-height:1.45}
.cost-ours{background:linear-gradient(180deg,#7262f4,#5a49e6);box-shadow:0 18px 36px -18px rgba(90,73,230,.8)}
.cost-ours .cost-v{color:#fff}
.cost-ours .cost-t{color:#e6e2ff}
.big-line{margin-top:24px;font-size:clamp(1.05rem,1rem + .3vw,1.2rem);line-height:1.5;font-weight:500;color:var(--head);text-wrap:pretty}

/* What ChatGPT said */
.ask{margin-top:28px;padding:clamp(18px,3vw,28px);border-radius:20px;background:#fff;box-shadow:0 0 0 1px var(--line),0 18px 40px -26px rgba(18,18,40,.35)}
.ask-q{display:inline-block;max-width:100%;margin-bottom:20px;padding:12px 16px;border-radius:16px 16px 16px 4px;background:var(--accent-50);font-size:17px;font-weight:600;line-height:1.35;color:var(--ink)}
.ask-who{display:block;margin-bottom:2px;font-size:12.5px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--accent-ink)}
.pts{display:grid;gap:14px;margin-top:24px}
.ask .pts{margin-top:0}
.pts li{display:flex;gap:12px;align-items:flex-start;font-size:16px;line-height:1.5;color:var(--head)}
.pts svg{flex:none;width:24px;height:24px;margin-top:1px;padding:5px;border-radius:50%;background:var(--accent-50);color:var(--accent-ink)}

/* What we do: small purple squares, like the home page's "All of this. Done for you." */
.hp-grid{display:grid;gap:14px;max-width:1040px;margin:32px auto 0}
@media (min-width:640px){.hp-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1000px){.hp-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.hp-it{padding:22px;border-radius:16px;background:#fff;box-shadow:0 0 0 1px var(--line)}
.hp-it i{display:block;width:12px;height:12px;margin-bottom:14px;border-radius:3px;background:var(--accent)}
.hp-it h3{font-size:17px;font-weight:600;line-height:1.3;letter-spacing:-.015em;color:var(--ink)}
.hp-it p{margin-top:6px;font-size:15px;line-height:1.5}

/* Eduardo's review */
.rv{display:grid;gap:24px;margin-top:28px;align-items:center}
@media (min-width:700px){.rv{grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:36px}}
.rv-frame{position:relative;max-width:320px;width:100%;margin:0 auto;aspect-ratio:9 / 16;border-radius:20px;overflow:hidden;background:#1b1830;box-shadow:0 30px 60px -28px rgba(45,30,140,.55)}
.rv-video{display:block;width:100%;height:100%;object-fit:cover}
.rv-q p{font-size:clamp(1.1rem,1rem + .4vw,1.3rem);line-height:1.45;font-weight:500;color:var(--ink)}
.rv-q p+p{margin-top:12px}
.rv-who{margin-top:16px;font-size:15px}
.rv-who b{color:var(--ink)}
.rv-who a{color:var(--accent-ink);font-weight:600}
.rv-note{margin-top:6px;font-size:13.5px;color:var(--soft)}

/* The price: a deep purple panel, like the home page's price card */
.price{padding:clamp(26px,5vw,44px);border-radius:24px;text-align:center;color:#e6e2ff;background:radial-gradient(80% 60% at 50% 0%,rgba(255,255,255,.18),rgba(255,255,255,0) 70%),linear-gradient(180deg,#4b3bd6,#2f2392);box-shadow:0 40px 80px -40px rgba(47,35,146,.9)}
.price-h{font-size:18px;font-weight:500;color:#e6e2ff}
.price-v{display:block;font-family:var(--display);font-size:clamp(3.2rem,2.6rem + 3vw,4.6rem);font-weight:650;line-height:1;letter-spacing:-.05em;color:#fff}
.price-ticks{display:grid;gap:12px;max-width:30em;margin:26px auto 28px;text-align:left}
.price-ticks li{display:flex;gap:10px;align-items:flex-start;font-size:15.5px;line-height:1.45}
.price-ticks svg{flex:none;width:22px;height:22px;padding:4px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff}

/* Questions: plain open-and-close answers */
.faq{display:grid;gap:10px;margin-top:28px}
.qa{border-radius:14px;background:#fff;box-shadow:0 0 0 1px var(--line)}
.qa summary{display:flex;justify-content:space-between;gap:16px;padding:17px 20px;font-size:16.5px;font-weight:600;color:var(--ink);cursor:pointer;list-style:none}
.qa summary::-webkit-details-marker{display:none}
.qa summary::after{content:"+";flex:none;font-size:22px;line-height:1;font-weight:400;color:var(--accent-ink)}
.qa[open] summary::after{content:"−"}
.qa p{padding:0 20px 18px;font-size:15.5px;line-height:1.55}

.close{text-align:center}
.close-ross{width:84px;height:84px;margin:0 auto 20px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 4px var(--accent-50)}

.foot{border-top:1px solid var(--line);padding:28px 0 34px;font-size:13px;line-height:1.55;color:var(--soft)}
.src{display:grid;gap:10px;max-width:820px}
.src b{color:var(--head)}
.src ul{display:grid;gap:4px;padding-left:18px;list-style:disc}
.src a{text-decoration:underline;text-underline-offset:2px}
.src a:hover{color:var(--ink)}
.foot-links{display:flex;flex-wrap:wrap;gap:18px;margin-top:22px;font-size:13.5px}
.foot-links a:hover{color:var(--ink)}

/* Cookie notice for the Meta pixel in the head (the same as the home page's) */
.ck{position:fixed;z-index:60;left:16px;bottom:16px;max-width:440px;display:flex;align-items:center;gap:16px;padding:12px 12px 12px 18px;border-radius:16px;background:#fff;box-shadow:0 0 0 1px rgba(18,18,40,.08),0 18px 40px -16px rgba(18,18,40,.35)}
.ck-tx{font-size:14px;line-height:1.45;color:var(--ink)}
.ck-tx a{color:var(--text);text-decoration:underline;text-underline-offset:2px}
.ck-btns{display:flex;gap:8px;flex:none}
.ck .btn-sec{color:var(--head);background:#fff;border:1px solid #e2e2e8;box-shadow:0 1px 2px rgba(18,18,40,.06)}
@media (max-width:600px){.ck{left:12px;right:12px;bottom:12px;max-width:none;align-items:center;gap:10px;padding:10px 10px 10px 14px}.ck-tx{font-size:13px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
</style>
<!-- META_PIXEL -->
</head>
<body>
<!-- VSL_BODY -->
<!-- Cookie notice for the Meta pixel in the head (the same as the home page's) -->
<div class="ck" id="ck" role="region" aria-label="Cookies" hidden>
  <p class="ck-tx"><span class="ck-q">We use cookies to see which of our ads work.</span> <a href="/privacy#cookies">Privacy</a></p>
  <div class="ck-btns">
    <button class="btn btn-sec btn-sm ck-no" type="button">No thanks</button>
    <button class="btn btn-pri btn-sm ck-ok" type="button">OK</button>
  </div>
</div>
<!-- COOKIE_SCRIPT -->
<script>
// Every "Book a call" button opens /book. An ad's utm_* tags replace the page's own (utm_medium=vsl,
// utm_campaign=<niche>), so Ross's email about the call and the admin chart say which ad it came from.
(function () {
  var q = new URLSearchParams(location.search), ad = new URLSearchParams();
  ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term'].forEach(function (k) { if (q.get(k)) ad.set(k, q.get(k).slice(0, 200)); });
  if (q.get('fbclid')) ad.set('fbclid', q.get('fbclid').slice(0, 300));
  if (!ad.toString()) return;
  Array.prototype.forEach.call(document.querySelectorAll('a[data-book]'), function (a) {
    var url = new URL(a.getAttribute('href'), location.href), keep = new URLSearchParams();
    if (url.searchParams.get('for')) keep.set('for', url.searchParams.get('for'));
    ad.forEach(function (v, k) { keep.set(k, v); });
    a.setAttribute('href', '/book?' + keep);
  });
})();
// The videos load nothing until someone presses play (they can be big on a phone).
(function () {
  Array.prototype.forEach.call(document.querySelectorAll('[data-video-play]'), function (btn) {
    var video = btn.parentNode.querySelector('[data-video]');
    if (!video) return;
    btn.hidden = false;
    video.removeAttribute('controls');
    btn.addEventListener('click', function () {
      btn.hidden = true;
      video.setAttribute('controls', '');
      video.removeAttribute('tabindex');
      var p = video.play();
      if (p && p.catch) p.catch(function () { /* the person can press play on the video itself */ });
      video.focus();
    });
  });
})();
</script>
</body>
</html>
