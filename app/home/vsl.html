<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__</title>
<meta name="description" content="__DESCRIPTION__">
<!-- rankwithross.com.au/for/<niche> (served by app/routes/for.$niche.tsx, Ross 17 Nov 2026): the pages Ross's video ads
     send each niche to. Ross's video first, the "Book a call" button right under it, then a few short sections. The words
     for each niche are in app/lib/vsl/pages.ts and drawn by app/lib/vsl/render.ts in place of the VSL_BODY marker.
     Kept out of search (noindex): they're for ads, and they're near-copies of each other. -->
<meta name="robots" content="noindex">
<link rel="canonical" href="__URL__">
<meta name="theme-color" content="#1f1e24">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Rank with Ross">
<meta property="og:title" content="__TITLE__">
<meta property="og:description" content="__DESCRIPTION__">
<meta property="og:url" content="__URL__">
<meta property="og:image" content="https://rankwithross.com.au/og/home.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preload" href="__FONT_URL__" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="__SERIF_URL__" as="font" type="font/woff2" crossorigin>
<script>document.documentElement.className += ' js';</script>
<style>
/* The look (Ross, 17 Nov 2026, inspired by forgoodprofits.com): a dark top, white page, serif headings, handwritten notes
   and line drawings, one purple for things to press. Fonts: Inter for words, Libre Baskerville for headings and Caveat
   for the handwriting (both SIL Open Font License, unchanged files from fontsource). */
@font-face{font-family:Inter;src:url(__FONT_URL__) format("woff2");font-weight:400 700;font-style:normal;font-display:swap}
@font-face{font-family:"Inter Fallback";src:local("Arial");ascent-override:93.51%;descent-override:23.28%;line-gap-override:0%;size-adjust:103.6%}
@font-face{font-family:RRSerif;src:url(__SERIF_URL__) format("woff2");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:RRSerif;src:url(__SERIF400_URL__) format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:RRHand;src:url(__HAND_URL__) format("woff2");font-weight:700;font-style:normal;font-display:swap}

:root{
  --char:#1f1e24;--ink:#1b1a20;--text:#55535c;--soft:#7a7882;--line:#e7e5ee;--bg-2:#f7f6fa;
  --accent:#6c5cf2;--accent-lo:#5a49e6;--accent-ink:#5442df;--accent-50:#f2f0fe;--lilac:#c9c2ff;
  --good:#15803d;
  --sans:Inter,"Inter Fallback",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:RRSerif,Georgia,"Times New Roman",serif;
  --hand:RRHand,"Segoe Print","Bradley Hand",cursive;
  --gut:16px;
}
@media (min-width:640px){:root{--gut:24px}}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:#fff;color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-x:clip}
img,svg{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
h1,h2,h3,p,ul,ol,blockquote{margin:0}
ul,ol{padding:0;list-style:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
::selection{background:#e4e0fd;color:var(--ink)}
[hidden]{display:none!important}
.wrap{max-width:1080px;margin:0 auto;padding:0 var(--gut)}
.narrow{max-width:calc(780px + 2 * var(--gut))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 22px;border-radius:999px;font-size:16px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;-webkit-tap-highlight-color:transparent;transition:transform .15s ease,background .2s ease}
.btn:active{transform:scale(.97)}
.btn-pri{color:#fff;background:var(--accent);box-shadow:0 10px 24px -10px rgba(108,92,242,.75)}
.btn-pri:hover{background:var(--accent-lo)}
.btn-sm{height:40px;padding:0 17px;font-size:15px;box-shadow:none}
.btn-lg{height:58px;padding:0 30px;font-size:17.5px}

/* The top bar and the hero: dark */
.top{background:var(--char);color:#fff}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;height:72px}
.logo{display:inline-flex;align-items:center;gap:10px;font-size:18px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
/* The logo mark: Ross's face on purple (public/brand/ross-mark.webp). */
.mark{flex:none;width:36px;height:36px;border-radius:50%;background:#6c5cf2 url(/brand/ross-mark.webp) center/cover}
.top-r{display:flex;align-items:center;gap:20px;font-size:15px}
.top-txt{color:#cfcdd6}
.top-txt a{color:#fff;font-weight:600}

.hero{background:var(--char);color:#fff;text-align:center;padding:clamp(36px,6vw,64px) 0 clamp(150px,22vw,250px)}
.hi{display:inline-block;margin-bottom:clamp(20px,2.6vw,32px);font-family:var(--hand);font-weight:700;font-size:clamp(25px,2.4vw,31px);line-height:1.2;color:var(--lilac);transform:rotate(-2deg)}
.h1{max-width:880px;margin:0 auto;font-family:var(--serif);font-weight:700;font-size:clamp(33px,5.4vw,60px);line-height:1.12;letter-spacing:-.01em;text-wrap:balance}
.h1 em{font-style:italic;color:var(--lilac)}
.hero-note{display:inline-flex;align-items:flex-start;gap:2px;margin:22px 0 0 120px;font-family:var(--hand);font-weight:700;font-size:25px;line-height:1.1;transform:rotate(3deg)}
.hero-note svg{width:62px;height:62px;margin-top:6px;color:var(--lilac)}

/* Ross's video, overlapping the dark hero, with a white ring */
.video{position:relative;z-index:2;margin-top:clamp(-190px,-16vw,-110px)}
.vsl{position:relative;max-width:900px;margin:0 auto;aspect-ratio:16 / 9;border-radius:22px;overflow:hidden;background:#2a2930;box-shadow:0 0 0 8px #fff,0 40px 80px -30px rgba(20,18,30,.55)}
.vsl-tall{max-width:380px}
.vsl-box{position:relative;max-width:900px;margin:0 auto}
.vsl-box:has(.vsl-tall){max-width:380px}
/* On wide screens "Watch this first!" sits to the right of the video (Ross, 17 Nov 2026), its arrow pointing in */
.side-note{display:none}
@media (min-width:1240px){
  .hero-note{display:none}
  .side-note{display:block;position:absolute;left:calc(100% + 34px);top:22px;color:#fff;font-family:var(--hand);font-weight:700;font-size:28px;line-height:1.05;text-align:left;white-space:nowrap;transform:rotate(4deg)}
  .side-note svg{width:70px;height:70px;margin:8px 0 0 -26px;color:var(--lilac)}
}
.vsl-video,.vsl-cover{display:block;width:100%;height:100%;object-fit:cover;background:#2a2930}
.vsl-frame{position:absolute;inset:0;width:100%;height:100%;border:0}
.vsl-btn{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:flex-start;padding:0 0 26px 28px;background:linear-gradient(180deg,rgba(0,0,0,0) 55%,rgba(10,8,20,.35));text-align:left}
.vsl-pill{display:inline-flex;align-items:center;gap:14px;padding:8px 22px 8px 8px;border-radius:999px;background:rgba(20,18,30,.84);color:#fff;font-size:16px;line-height:1.3;text-align:left;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.vsl-soon .vsl-pill{position:absolute;left:28px;bottom:26px}
.vsl-pill b{display:block;font-weight:600}
.vsl-pill small{display:block;font-size:13px;font-weight:500;color:#c9c7d0}
.vsl-play{display:grid;place-items:center;flex:none;width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;box-shadow:0 0 0 8px rgba(108,92,242,.3)}
.vsl-play svg{width:22px;height:22px;margin-left:3px}
.vsl-clock svg{margin:0}

.cta{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:34px;text-align:center}
.cta-sub{font-size:15px;color:var(--text);text-wrap:balance}
.cta-sub a,.price-me a,.foot a[href^="sms"]{color:var(--accent-ink);font-weight:600;white-space:nowrap}
.cta-sub a:hover,.price-me a:hover{text-decoration:underline}

/* Eduardo's review */
.proof{padding:clamp(64px,8vw,90px) 0 0}
.proof-in{display:grid;gap:32px;align-items:center;max-width:calc(900px + 2 * var(--gut))}
@media (min-width:760px){.proof-in{grid-template-columns:220px minmax(0,1fr);gap:44px}}
.rv-frame{position:relative;width:220px;margin:0 auto;aspect-ratio:9 / 16;border-radius:18px;overflow:hidden;background:#2a2930;box-shadow:0 0 0 6px #fff,0 0 0 7px var(--line),0 24px 44px -22px rgba(0,0,0,.45);transform:rotate(-3deg)}
.rv-video{display:block;width:100%;height:100%;object-fit:cover}
.rv-btn{align-items:flex-end;justify-content:center;padding:0 0 18px}
.rv-q p{margin-top:16px;font-family:var(--serif);font-size:clamp(21px,2.4vw,26px);line-height:1.38;color:var(--ink)}
.rv-who{margin-top:16px;font-size:15.5px;color:var(--text)}
.rv-who b{color:var(--ink)}
.rv-who a{color:var(--accent-ink);font-weight:600}
.rv-who a:hover{text-decoration:underline}
.rv-note{margin-top:6px;font-size:13.5px;color:var(--soft)}
@media (max-width:759px){.proof-in>div:last-child{text-align:center}.rv-frame{width:180px}}

/* Sections: a handwritten line, then a serif heading */
.sec{padding:clamp(68px,9vw,100px) 0}
.sec-soft{background:var(--bg-2)}
.sec-head{text-align:center}
.kick{display:inline-block;font-family:var(--hand);font-weight:700;font-size:clamp(25px,2.4vw,29px);line-height:1.2;color:var(--accent);transform:rotate(-2deg)}
.h2{max-width:760px;margin:6px auto 0;font-family:var(--serif);font-weight:700;font-size:clamp(28px,4vw,44px);line-height:1.17;letter-spacing:-.01em;text-wrap:balance}
.proof .h2{margin:4px 0 0}

/* Problems and what I do: a drawing and a few words, side by side, taking turns */
.rows{display:grid;gap:clamp(44px,6vw,68px);margin-top:clamp(40px,6vw,60px)}
.row{display:grid;gap:22px;align-items:center}
@media (min-width:760px){.row{grid-template-columns:1fr 1fr;gap:56px}.row:nth-child(even) .doodle{order:2}}
.doodle{display:grid;place-items:center;aspect-ratio:16 / 10;border-radius:24px;background:var(--bg-2);border:1.5px solid var(--line);color:var(--ink)}
.sec-soft .doodle{background:#fff}
.doodle svg{width:80%;height:auto}
.row h3{font-family:var(--serif);font-weight:700;font-size:clamp(23px,2.4vw,28px);line-height:1.25;color:var(--ink);text-wrap:balance}
.row p{margin-top:12px;font-size:17.5px;color:var(--text);text-wrap:pretty}
.row .note{display:inline-block;margin-top:12px;font-family:var(--hand);font-weight:700;font-size:25px;line-height:1.15;color:var(--accent);transform:rotate(-1.5deg)}
.js .fade{opacity:.25;transform:translateY(10px);transition:opacity .6s ease,transform .6s ease}
.js .fade.on{opacity:1;transform:none}

/* The honest table */
.tbl{max-width:860px;margin:clamp(36px,5vw,48px) auto 0;border-radius:22px;border:1.5px solid var(--line);background:#fff;overflow:hidden}
.tbl table{width:100%;border-collapse:collapse;font-size:17px;line-height:1.45}
.tbl th,.tbl td{padding:18px 22px;text-align:left;vertical-align:top;border-top:1px solid var(--line)}
.tbl thead th{border-top:0;font-size:15px;font-weight:600;color:var(--soft)}
.tbl thead th.me{color:var(--accent-ink);white-space:nowrap}
.tbl thead th.me .mark{display:inline-block;width:26px;height:26px;margin-right:8px;vertical-align:middle}
.tbl tbody th{font-weight:500;color:var(--text)}
.tbl td{color:var(--text)}
.tbl td.me{background:#f5f3ff;font-weight:600;color:var(--ink)}
.ok{color:var(--good);font-weight:700}
.tbl-src{max-width:860px;margin:12px auto 0;font-size:13px;color:var(--soft)}
@media (max-width:600px){.tbl table{font-size:14.5px}.tbl th,.tbl td{padding:12px 11px}}

/* Eduardo's second line, big */
.pull{padding:clamp(60px,8vw,90px) 0;text-align:center}
.pull-q p{max-width:820px;margin:0 auto;font-family:var(--serif);font-size:clamp(27px,4.2vw,42px);line-height:1.3;color:var(--ink);text-wrap:balance}
.pull-who{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:26px;font-size:16px;color:var(--text)}
.pull-who img{width:56px;height:56px;border-radius:50%;object-fit:cover;object-position:50% 22%;box-shadow:0 0 0 3px #fff,0 0 0 4px var(--line)}
.pull-who b{color:var(--ink)}

/* One big line on a dark band, signed */
.band{background:var(--char);color:#fff;text-align:center;padding:clamp(64px,8vw,88px) 0}
.band-line{max-width:820px;margin:0 auto;font-family:var(--serif);font-weight:700;font-size:clamp(27px,4vw,40px);line-height:1.25;text-wrap:balance}
.band-note{max-width:620px;margin:18px auto 0;font-size:16.5px;color:#c9c7d0;text-wrap:pretty}
.sig{margin-top:14px;font-family:var(--hand);font-weight:700;font-size:38px;line-height:1;color:var(--lilac);transform:rotate(-3deg)}

/* The 3 steps, joined by a dashed line, and the price */
.steps{position:relative;display:grid;gap:34px;max-width:900px;margin:clamp(40px,6vw,56px) auto 0;text-align:center}
@media (min-width:760px){.steps{grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}.steps::before{content:"";position:absolute;top:26px;left:17%;right:17%;border-top:2px dashed #d6d3e0}}
.steps li{position:relative}
.steps .n{display:grid;place-items:center;width:52px;height:52px;margin:0 auto;border-radius:50%;background:var(--accent);color:#fff;font-family:var(--serif);font-size:23px;font-weight:700;box-shadow:0 0 0 8px #fff}
.step-pic{width:150px;height:auto;margin:16px auto 0;color:var(--ink)}
.steps h3{margin-top:12px;font-family:var(--serif);font-weight:700;font-size:22px;line-height:1.25}
.steps p{max-width:250px;margin:8px auto 0;font-size:16px;color:var(--text)}

.price{position:relative;max-width:600px;margin:clamp(48px,7vw,64px) auto 0;padding:clamp(28px,5vw,40px) clamp(20px,5vw,40px);border-radius:26px;border:1.5px solid var(--line);background:#fff;text-align:center;box-shadow:0 30px 60px -40px rgba(20,18,30,.5)}
.price-note{margin-bottom:10px;font-family:var(--hand);font-weight:700;font-size:25px;line-height:1.15;color:var(--accent);transform:rotate(-2deg)}
@media (min-width:1000px){.price-note{position:absolute;top:30px;right:-168px;width:150px;margin:0;text-align:left;transform:rotate(6deg)}}
.price-h{font-family:var(--sans);font-size:19px;font-weight:500;color:var(--text)}
.price-v{font-family:var(--serif);font-size:clamp(52px,7vw,66px);font-weight:700;line-height:1;letter-spacing:-.01em;color:var(--ink)}
.price-ticks{display:grid;gap:9px;max-width:390px;margin:24px auto 28px;text-align:left}
.price-ticks li{display:flex;gap:10px;align-items:flex-start;font-size:16.5px;line-height:1.45;color:var(--text)}
.price-ticks svg{flex:none;width:20px;height:20px;margin-top:2px;color:var(--good)}
.price-me{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:20px;font-size:15px;color:var(--text)}
.price-me img{width:44px;height:44px;border-radius:50%;object-fit:cover}

/* Questions: plain open-and-close answers */
.faq{display:grid;gap:10px;margin-top:clamp(32px,5vw,44px)}
.qa{border-radius:16px;background:#fff;border:1.5px solid var(--line)}
.qa summary{display:flex;justify-content:space-between;gap:16px;padding:18px 20px;font-size:17px;font-weight:600;line-height:1.4;color:var(--ink);cursor:pointer;list-style:none}
.qa summary::-webkit-details-marker{display:none}
.qa summary::after{content:"+";flex:none;font-size:24px;line-height:1;font-weight:400;color:var(--accent-ink)}
.qa[open] summary::after{content:"−"}
.qa p{padding:0 20px 18px;font-size:16px;line-height:1.55;color:var(--text)}

.foot{background:var(--char);color:#a9a7b1;padding:48px 0 40px;font-size:13.5px;line-height:1.6}
.foot-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px 24px;padding-bottom:26px;margin-bottom:26px;border-bottom:1px solid rgba(255,255,255,.12)}
.foot .logo{color:#fff;font-size:19px}
.foot .mark{width:46px;height:46px}
.foot-top p{font-size:15px;color:#cfcdd6}
.foot a[href^="sms"]{color:#fff}
.src{display:grid;gap:10px;max-width:820px}
.src b{color:#e6e5ea}
.src ul{display:grid;gap:4px;padding-left:18px;list-style:disc}
.src a{text-decoration:underline;text-underline-offset:2px}
.src a:hover,.foot-links a:hover{color:#fff}
.foot-links{display:flex;flex-wrap:wrap;gap:18px;margin-top:24px}

@media (max-width:759px){
  body{font-size:16px}
  .top-txt{display:none}
  .top-in{height:64px}
  .logo{font-size:17px}
  .mark{width:32px;height:32px}
  .hero-note{margin-left:90px;font-size:22px}
  .hero-note svg{width:50px;height:50px}
  .vsl{border-radius:16px;box-shadow:0 0 0 5px #fff,0 30px 60px -30px rgba(20,18,30,.55)}
  .vsl-btn{align-items:flex-end;padding:0 0 10px 10px;background:none}
  .vsl-soon .vsl-pill{left:10px;top:10px;bottom:auto}
  .vsl-pill{gap:10px;padding:6px 14px 6px 6px;font-size:13px}
  .vsl-pill small{display:none}
  .vsl-btn .vsl-pill{padding:6px}
  .vsl-btn .vsl-pill>span:last-child{display:none}
  .vsl-play{width:38px;height:38px;box-shadow:0 0 0 5px rgba(108,92,242,.3)}
  .vsl-play svg{width:16px;height:16px}
  .rv-btn{align-items:flex-end;justify-content:center;padding:0 0 14px}
  .btn-lg{height:56px;padding:0 24px;font-size:17px}
  .row p{font-size:16.5px}
}

/* Cookie notice for the Meta pixel in the head (the same as the home page's) */
.ck{position:fixed;z-index:60;left:16px;bottom:16px;max-width:440px;display:flex;align-items:center;gap:16px;padding:12px 12px 12px 18px;border-radius:16px;background:#fff;box-shadow:0 0 0 1px rgba(18,18,40,.08),0 18px 40px -16px rgba(18,18,40,.35)}
.ck-tx{font-size:14px;line-height:1.45;color:var(--ink)}
.ck-tx a{color:var(--text);text-decoration:underline;text-underline-offset:2px}
.ck-btns{display:flex;gap:8px;flex:none}
.ck .btn-sec{color:var(--ink);background:#fff;border:1px solid #e2e2e8}
@media (max-width:600px){.ck{left:12px;right:12px;bottom:12px;max-width:none;align-items:center;gap:10px;padding:10px 10px 10px 14px}.ck-tx{font-size:13px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}.js .fade{opacity:1;transform:none}}
</style>
<!-- META_PIXEL -->
</head>
<body>
<!-- VSL_BODY -->
<!-- Cookie notice for the Meta pixel in the head (the same as the home page's) -->
<div class="ck" id="ck" role="region" aria-label="Cookies" hidden>
  <p class="ck-tx"><span class="ck-q">We use cookies to see which of our ads work.</span> <a href="/privacy#cookies">Privacy</a></p>
  <div class="ck-btns">
    <button class="btn btn-sec btn-sm ck-no" type="button">No thanks</button>
    <button class="btn btn-pri btn-sm ck-ok" type="button">OK</button>
  </div>
</div>
<!-- COOKIE_SCRIPT -->
<script>
// Every "Book a call" button opens /book. An ad's utm_* tags replace the page's own (utm_medium=vsl,
// utm_campaign=<niche>), so Ross's email about the call and the admin chart say which ad it came from.
(function () {
  var q = new URLSearchParams(location.search), ad = new URLSearchParams();
  ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term'].forEach(function (k) { if (q.get(k)) ad.set(k, q.get(k).slice(0, 200)); });
  if (q.get('fbclid')) ad.set('fbclid', q.get('fbclid').slice(0, 300));
  if (!ad.toString()) return;
  Array.prototype.forEach.call(document.querySelectorAll('a[data-book]'), function (a) {
    var url = new URL(a.getAttribute('href'), location.href), keep = new URLSearchParams();
    if (url.searchParams.get('for')) keep.set('for', url.searchParams.get('for'));
    ad.forEach(function (v, k) { keep.set(k, v); });
    a.setAttribute('href', '/book?' + keep);
  });
})();
// The words beside each drawing fade in as they reach the middle of the screen (all shown at once without it).
(function () {
  var els = document.querySelectorAll('.fade');
  if (!('IntersectionObserver' in window) || matchMedia('(prefers-reduced-motion: reduce)').matches) {
    Array.prototype.forEach.call(els, function (el) { el.classList.add('on'); });
    return;
  }
  var io = new IntersectionObserver(function (list) {
    list.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('on'); io.unobserve(e.target); } });
  }, { rootMargin: '0px 0px -25% 0px' });
  Array.prototype.forEach.call(els, function (el) { io.observe(el); });
})();
// The videos load nothing until someone presses play (they can be big on a phone).
(function () {
  Array.prototype.forEach.call(document.querySelectorAll('[data-video-play]'), function (btn) {
    var video = btn.parentNode.querySelector('[data-video]');
    if (!video) return;
    btn.hidden = false;
    video.removeAttribute('controls');
    btn.addEventListener('click', function () {
      btn.hidden = true;
      video.setAttribute('controls', '');
      video.removeAttribute('tabindex');
      var p = video.play();
      if (p && p.catch) p.catch(function () { /* the person can press play on the video itself */ });
      video.focus();
    });
  });
})();
// Ross's video on Loom: Loom's player loads only when someone presses play (no Loom cookies or weight before that).
// Without the script the button opens the video on Loom.
(function () {
  Array.prototype.forEach.call(document.querySelectorAll('[data-loom-play]'), function (btn) {
    var box = btn.parentNode;
    btn.addEventListener('click', function (e) {
      e.preventDefault();
      var f = document.createElement('iframe');
      f.className = 'vsl-frame';
      f.src = box.getAttribute('data-loom');
      f.title = 'Ross’s video';
      f.setAttribute('allow', 'autoplay; fullscreen; picture-in-picture');
      f.setAttribute('allowfullscreen', '');
      box.appendChild(f);
      btn.remove();
      f.focus();
    });
  });
})();
</script>
</body>
</html>
