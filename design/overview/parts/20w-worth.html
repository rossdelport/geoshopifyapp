<section class="section worth-sec" id="worth" aria-labelledby="worth-title">
  <div class="wrap">
    <div class="worth-band">
      <div class="worth-head">
        <h2 class="h2 worth-h2" id="worth-title">What are extra AI orders worth?</h2>
      </div>

      <div class="worth-art" aria-hidden="true">
        <img src="img/clay-coins.jpg" alt="" width="1024" height="1024" decoding="async">
      </div>

      <div class="worth-card">
        <div class="worth-field">
          <div class="worth-row">
            <label class="worth-lab" for="worth-aov">Average order value</label>
            <span class="worth-val tnum" id="worth-aov-out" aria-hidden="true">$80</span>
          </div>
          <div class="worth-range" style="--p:0.2143">
            <input type="range" id="worth-aov" name="aov" min="20" max="300" step="5" value="80" aria-valuetext="$80">
          </div>
          <div class="worth-ends" aria-hidden="true"><span>$20</span><span>$300</span></div>
        </div>

        <div class="worth-field">
          <div class="worth-row">
            <label class="worth-lab" for="worth-orders">Extra orders a month from AI</label>
            <span class="worth-val tnum" id="worth-orders-out" aria-hidden="true">5</span>
          </div>
          <div class="worth-range" style="--p:0.0816">
            <input type="range" id="worth-orders" name="orders" min="1" max="50" step="1" value="5" aria-valuetext="5 orders a month">
          </div>
          <div class="worth-ends" aria-hidden="true"><span>1</span><span>50</span></div>
        </div>

        <div class="worth-out">
          <div class="worth-nums" aria-hidden="true">
            <p class="worth-big"><span class="worth-m tnum" id="worth-month">$400</span><span class="worth-unit">a month</span></p>
            <p class="worth-yr"><span class="worth-y tnum" id="worth-year">$4,800</span><span class="worth-unit">a year</span></p>
          </div>
          <p class="worth-sum tnum" aria-live="polite" aria-atomic="true"><span id="worth-sum">5 orders × $80 = $400 a month</span><span class="worth-sr" id="worth-sum-yr"></span></p>
        </div>

        <p class="worth-core">GEO Core is US$49 a month. You decide what’s realistic for your store.</p>
      </div>
    </div>
  </div>
</section>
